# Production compose file. Lives at /srv/curriculum/docker-compose.yml on the server.
# deploy.sh fetches the copy for the commit being deployed and sets IMAGE.
# Container logs are kept by Docker's json-file driver, which never rotates by default and would
# slowly fill the disk. Cap every service at 3 files of 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${IMAGE:?IMAGE is set by deploy.sh}
    restart: unless-stopped
    logging: *default-logging
    # Bound to localhost only: the public entrance is the caddy service below, which reaches the
    # app as app:3000 over the compose network. This binding stays because deploy.sh's health
    # probe and SSH-tunnel access (ssh -L 3000:127.0.0.1:3000) use it.
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env # secrets (OPENROUTER_API_KEY); never committed
    environment:
      CURRICULUM_DB_PATH: /data/curriculum.db
    volumes:
      - /srv/curriculum/data:/data # SQLite database
      - /srv/curriculum/artifacts:/app/artifacts # generated worksheets and packets
      - /srv/curriculum/logs:/app/logs

  # The weekly loop's background process: the job queue worker plus the scheduler. Same image, same
  # data volume, no ports. It idles until LOOP_JOBS_ENABLED=1 is in /srv/curriculum/.env (the app
  # reads the same switch): off, nothing is planned or queued and no model call is made.
  # See docs/runbook-worker.md.
  worker:
    image: ${IMAGE:?IMAGE is set by deploy.sh}
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "worker", "--scheduler"]
    # appuser (see Dockerfile). The image's start.sh starts as root and drops to appuser, but this
    # command bypasses it. Running as root would leave root-owned SQLite WAL files the app cannot write.
    user: "1000:1000"
    env_file: .env
    environment:
      CURRICULUM_DB_PATH: /data/curriculum.db
      WORKER_HANDLER_MODULES: job_handlers_real
    stop_grace_period: 45s # above WORKER_SHUTDOWN_GRACE_SECONDS (30): a running job finishes or is released
    volumes:
      - /srv/curriculum/data:/data
      - /srv/curriculum/artifacts:/app/artifacts
      - /srv/curriculum/logs:/app/logs

  # HTTPS entrance. Needs Docker Compose >= 2.24.0 (inline `configs: content:` and `required: false`).
  # SITE_DOMAIN comes from caddy.env, NOT .env: this is the internet-facing process and must not see
  # the app's secrets. If caddy.env is missing it serves a harmless localhost site so the stack starts.
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *default-logging
    # Floating minor tag (not a digest) so security patch releases arrive with each pull.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # bind 80/443 as a non-root-capable process; nothing else
    depends_on:
      - app
    ports:
      # IPv4 only on purpose. A bare "443:443" also listens on [::], where Docker's userland proxy can
      # replace the visitor's address with the Docker gateway and collapse every IPv6 visitor into
      # one login-lockout bucket. To turn IPv6 on deliberately, see deploy/README.md.
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    env_file:
      - path: caddy.env # only SITE_DOMAIN; written by bootstrap.sh
        required: false
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data # certificates, ACME account and the access log: must survive redeploys
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# Inline so deploy.sh, which downloads only this file, is enough. `$$` is a literal `$` after
# compose interpolation, so Caddy sees {$SITE_DOMAIN:localhost}.
configs:
  caddyfile:
    content: |
      {
        servers {
          timeouts {
            read_header 10s
          }
        }
      }

      {$$SITE_DOMAIN:localhost} {
        # Who asked for what, kept so "was this site probed or abused?" can be answered later.
        # One JSON line per request in the persistent volume (read it with the commands in
        # docs/runbook-https.md). At most 10 files of 20 MiB and 30 days, so it cannot fill the disk
        # or keep visitor addresses indefinitely. Cookies, tokens and Set-Cookie are removed on top of
        # Caddy's own redaction, and the login body is never logged (Caddy does not log bodies).
        log {
          output file /data/access.log {
            roll_size 20MiB
            roll_keep 10
            roll_keep_for 720h
          }
          format filter {
            wrap json
            fields {
              request>headers>Cookie delete
              request>headers>Authorization delete
              request>headers>Proxy-Authorization delete
              resp_headers>Set-Cookie delete
            }
          }
        }
        encode zstd gzip
        request_body {
          max_size 10MB
        }
        reverse_proxy app:3000 {
          header_up X-Forwarded-For {remote_host}
          header_up X-Forwarded-Proto {scheme}
        }
        header {
          # HSTS is short for now: raise it (and consider includeSubDomains) after the certificate
          # has renewed cleanly at least once.
          Strict-Transport-Security "max-age=86400"
          X-Frame-Options DENY
          # frame-ancestors only: there is no script-src/default-src CSP yet.
          Content-Security-Policy "frame-ancestors 'none'"
          Permissions-Policy "camera=(), microphone=(), geolocation=()"
          X-Content-Type-Options nosniff
          Referrer-Policy strict-origin-when-cross-origin
          -Server
        }
      }
