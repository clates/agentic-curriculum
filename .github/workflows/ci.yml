name: CI

on:
  pull_request:
    branches: [main, master]
  # Called from build-and-release.yml so a push to main is tested before it ships.
  workflow_call:

# Runtime versions: keep in step with the Dockerfile (NODE_IMAGE / PYTHON_IMAGE).
env:
  PYTHON_VERSION: "3.15"
  NODE_VERSION: "26"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run type check
        working-directory: frontend
        run: npm run type-check

      - name: Run Prettier check
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04 # Playwright chromium does not support ubuntu 26.04 yet

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Create venv and install Python dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_DB_FILE: /tmp/playwright-test.db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The production image is otherwise only built after a merge to main, so a broken Dockerfile would
  # be found after it shipped. This builds the exact image on every pull request and pushes nothing.
  # Skipped when called from build-and-release.yml, which builds (and pushes) the image itself.
  docker-build:
    name: Docker image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: agentic-curriculum:pr-${{ github.event.pull_request.number }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=pr-build
            RELEASE_TAG=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs and reports its runtimes
        run: |
          IMAGE=agentic-curriculum:pr-${{ github.event.pull_request.number }}
          docker run --rm "$IMAGE" node --version
          docker run --rm "$IMAGE" python --version
          docker run --rm -e PYTHONPATH=/app/src "$IMAGE" python -c "import main; print('backend imports OK')"
          # Development and test tools must not ship in the production image.
          if docker run --rm "$IMAGE" python -c "import pytest" 2>/dev/null; then
            echo "pytest is installed in the production image" >&2; exit 1
          fi
