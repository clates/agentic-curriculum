name: Build and Release

on:
  push:
    branches:
      - main
  # Manual redeploy of main (for example after rotating a secret).
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One release at a time; a newer push waits instead of racing the server.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  IMAGE_NAME: chrislates/agentic-curriculum

jobs:
  # Nothing is built or deployed unless the full test suite passes.
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: release_tag
        run: |
          TAG="auto-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The commit SHA tag is what the server deploys and rolls back to.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.release_tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Create git tag
        if: ${{ success() }}
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release $TAG"
          git push origin "$TAG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The key is restricted on the server to a single forced command (deploy.sh),
      # so it cannot open a shell or run anything else.
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@${DEPLOY_HOST}" "${GITHUB_SHA}"
